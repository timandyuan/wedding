<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Tim & Yuan | The Best Tee-mate</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --sand: #d4a373;
      --sage: #8da399;
      --cream: #f8f4ed;
      --warm-white: #fffdf9;
      --ink: #403b35;
      --muted: #81776d;
      --line: rgba(64, 59, 53, 0.14);
      --white-glow: rgba(255,255,255,0.82);
      --shadow: 0 18px 45px rgba(64, 59, 53, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--cream);
      font-family: "Noto Serif TC", serif;
      line-height: 1.8;
    }

    h1,
    h2,
    h3,
    .english,
    .nav-logo,
    .count-number,
    .count-label {
      font-family: "Cormorant Garamond", "Noto Serif TC", serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    /* =========================
       Navigation
    ========================== */

    .navbar {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: min(92%, 900px);
      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 12px 20px;

      background: rgba(255, 253, 249, 0.66);
      border: 1px solid rgba(255,255,255,0.65);
      border-radius: 999px;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow: 0 8px 30px rgba(64, 59, 53, 0.08);
    }

    .nav-logo {
      font-size: 1.35rem;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .nav-links a {
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      white-space: nowrap;
      transition: opacity 0.25s ease;
    }

    .nav-links a:hover {
      opacity: 0.55;
    }

    /* =========================
       Hero
    ========================== */

    .hero {
      min-height: 100svh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;

      background-image:
        linear-gradient(
          rgba(48, 43, 37, 0.16),
          rgba(48, 43, 37, 0.30)
        ),
        url("https://i.postimg.cc/wxJx0JfH/IMG-2199.jpg");

      background-size: cover;
      background-position: center;
    }

    .hero-content {
      text-align: center;
      color: white;
      padding: 100px 20px 50px;
      text-shadow: 0 3px 20px rgba(0,0,0,0.18);
    }

    .hero-small {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(1rem, 2vw, 1.35rem);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .hero-title {
      margin: 0;
      font-size: clamp(4rem, 12vw, 8rem);
      font-weight: 500;
      line-height: 0.85;
      letter-spacing: 0.02em;
    }

    .hero-tagline {
      margin: 28px 0 12px;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(1.4rem, 4vw, 2.3rem);
      font-style: italic;
      letter-spacing: 0.04em;
    }

    .hero-date {
      font-size: 0.95rem;
      letter-spacing: 0.22em;
      white-space: nowrap;
    }

    .scroll-hint {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-family: "Cormorant Garamond", serif;
      letter-spacing: 0.2em;
      font-size: 0.8rem;
      opacity: 0.9;
    }

    /* =========================
       General sections
    ========================== */

    section {
      padding: 100px 20px;
    }

    .section-inner {
      width: min(100%, 980px);
      margin: 0 auto;
    }

    .section-heading {
      text-align: center;
      margin-bottom: 55px;
    }

    .section-kicker {
      color: var(--sand);
      font-family: "Cormorant Garamond", serif;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      font-size: 0.9rem;
    }

    .section-title {
      font-size: clamp(2.4rem, 6vw, 4rem);
      font-weight: 500;
      margin: 8px 0 12px;
      line-height: 1;
    }

    .section-subtitle {
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* =========================
       Countdown
    ========================== */

    .countdown-section {
      background:
        radial-gradient(
          circle at top center,
          rgba(212,163,115,0.13),
          transparent 50%
        ),
        var(--cream);
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      max-width: 780px;
      margin: 0 auto;
    }

    .count-card {
      position: relative;
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(255,255,255,0.95);
      border-radius: 22px;
      padding: 25px 12px;

      box-shadow:
        0 12px 30px rgba(64,59,53,0.09),
        inset 0 0 22px rgba(255,255,255,0.7);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      text-align: center;
    }

    .count-card:not(:last-child)::after {
      content: "";
      position: absolute;
      right: -8px;
      top: 25%;
      height: 50%;
      width: 1px;
      background: rgba(64,59,53,0.18);
    }

    .count-number {
      display: block;
      font-size: clamp(2.8rem, 7vw, 5rem);
      line-height: 1;
      font-weight: 500;
      color: var(--ink);
    }

    .count-label {
      display: block;
      margin-top: 8px;
      font-size: 0.95rem;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* =========================
       V Cards
    ========================== */

    .details-section {
      background: var(--warm-white);
    }

    .v-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .v-card {
      position: relative;
      min-height: 280px;

      padding: 38px 28px;

      background: var(--cream);
      border-radius: 100px 100px 24px 24px;

      box-shadow: var(--shadow);

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .v-card::before {
      content: "";
      position: absolute;
      top: 25px;
      width: 35px;
      height: 1px;
      background: var(--sand);
    }

    .v-card-icon {
      font-size: 1.6rem;
      margin-bottom: 12px;
    }

    .v-card-title {
      font-family: "Cormorant Garamond", serif;
      font-size: 2rem;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .v-card-text {
      color: var(--muted);
      font-size: 0.88rem;
    }

    /* =========================
       Timeline
    ========================== */

    .timeline {
      max-width: 700px;
      margin: 0 auto;
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 25px;
      padding: 25px 0;
      border-bottom: 1px solid var(--line);
    }

    .timeline-time {
      font-family: "Cormorant Garamond", serif;
      color: var(--sand);
      font-size: 1.45rem;
      white-space: nowrap;
    }

    .timeline-title {
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .timeline-desc {
      font-size: 0.82rem;
      color: var(--muted);
    }

    /* =========================
       Accordion
    ========================== */

    .travel-section {
      background: #eee8de;
    }

    .accordion {
      max-width: 820px;
      margin: 0 auto;
    }

    .accordion-item {
      margin-bottom: 12px;
      border: 1px solid rgba(64,59,53,0.1);
      border-radius: 16px;
      overflow: hidden;
      background: rgba(255,255,255,0.56);
    }

    .accordion-button {
      width: 100%;
      border: 0;
      background: transparent;
      padding: 20px 22px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      cursor: pointer;

      color: var(--ink);
      font-size: 0.95rem;
      text-align: left;
    }

    .accordion-button span:first-child {
      white-space: nowrap;
    }

    .accordion-symbol {
      font-family: "Cormorant Garamond", serif;
      font-size: 1.5rem;
      transition: transform 0.3s ease;
    }

    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
    }

    .accordion-inner {
      padding: 0 22px 22px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .accordion-item.active .accordion-symbol {
      transform: rotate(45deg);
    }

    .no-wrap {
      white-space: nowrap;
    }

    /* =========================
       RSVP
    ========================== */

    .rsvp-section {
      background:
        linear-gradient(
          135deg,
          rgba(141,163,153,0.17),
          rgba(212,163,115,0.12)
        );
    }

    .rsvp-form {
      max-width: 700px;
      margin: 0 auto;
      padding: 42px;

      background: rgba(255,253,249,0.82);
      border-radius: 30px;

      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .field {
      margin-bottom: 22px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.88rem;
      letter-spacing: 0.04em;
    }

    .field label .en {
      font-family: "Cormorant Garamond", serif;
      font-size: 1.05rem;
      margin-left: 5px;
      letter-spacing: 0.08em;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid rgba(64,59,53,0.16);
      border-radius: 12px;
      padding: 13px 15px;

      background: rgba(255,255,255,0.7);
      color: var(--ink);

      outline: none;
      transition: border 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--sage);
      box-shadow: 0 0 0 3px rgba(141,163,153,0.12);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .conditional-fields {
      display: none;
    }

    .conditional-fields.show {
      display: block;
      animation: fadeIn 0.35s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .submit-button {
      width: 100%;
      margin-top: 12px;

      border: none;
      border-radius: 999px;

      padding: 15px 25px;

      background: var(--sage);
      color: white;

      font-family: "Cormorant Garamond", serif;
      font-size: 1.25rem;
      letter-spacing: 0.12em;

      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .submit-button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .form-note {
      text-align: center;
      color: var(--muted);
      font-size: 0.76rem;
      margin-top: 18px;
    }

    /* =========================
       Footer
    ========================== */

    footer {
      padding: 70px 20px;
      text-align: center;
      background: var(--ink);
      color: var(--cream);
    }

    .footer-names {
      font-family: "Cormorant Garamond", serif;
      font-size: 3rem;
      letter-spacing: 0.08em;
    }

    .footer-tagline {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 1.35rem;
      margin-top: 8px;
    }

    .footer-date {
      margin-top: 22px;
      font-size: 0.78rem;
      letter-spacing: 0.2em;
    }

    /* =========================
       Hidden Google Form iframe
    ========================== */

    #google-form-frame {
      display: none;
      width: 0;
      height: 0;
      border: 0;
      position: absolute;
      left: -9999px;
    }

    /* =========================
       Mobile
    ========================== */

    @media (max-width: 760px) {

      .navbar {
        top: 10px;
        padding: 10px 14px;
        width: calc(100% - 20px);
      }

      .nav-logo {
        font-size: 1.1rem;
      }

      .nav-links {
        gap: 11px;
      }

      .nav-links a {
        font-size: 0.67rem;
        letter-spacing: 0;
      }

      section {
        padding: 75px 17px;
      }

      .hero {
        background-position: center center;
      }

      .hero-title {
        font-size: clamp(3.6rem, 17vw, 6rem);
      }

      .hero-tagline {
        font-size: 1.5rem;
      }

      .countdown {
        gap: 8px;
      }

      .count-card {
        padding: 20px 5px;
        border-radius: 16px;
      }

      .count-number {
        font-size: clamp(2.1rem, 11vw, 3.2rem);
      }

      .count-label {
        font-size: 0.68rem;
        letter-spacing: 0.08em;
      }

      .v-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .v-card {
        min-height: 230px;
      }

      .timeline-item {
        grid-template-columns: 85px 1fr;
        gap: 15px;
      }

      .timeline-time {
        font-size: 1.15rem;
      }

      .rsvp-form {
        padding: 28px 20px;
        border-radius: 22px;
      }

      .accordion-button {
        padding: 17px;
      }

      .accordion-inner {
        padding: 0 17px 18px;
      }

      /*
        關鍵地點 / 地址 / 捷運站
        永遠禁止手機自動斷行
      */
      .no-wrap,
      .station-name,
      .address,
      .key-location {
        white-space: nowrap;
        word-break: keep-all;
      }
    }
  </style>
</
